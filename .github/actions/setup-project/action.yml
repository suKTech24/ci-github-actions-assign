name: 'Setup Project'
description: 'Sets up Node and installs dependencies'

inputs:
  node-version:
    description: 'Which version of Node to install'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash